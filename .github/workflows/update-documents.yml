name: Update site libraries

on:
  push:
    paths:
      - ".github/workflows/update-documents.yml"
      - "eng-practice/*.html"
      - "eng-practice/Vocabulary/**/*.html"
      - "eng-practice/grammar/**/*.html"
      - "eng-practice/listening/**/*.html"
      - "eng-practice/speaking/**/*.html"
      - "eng-practice/writing/**/*.html"
      - "eng-practice/guides/**/*.html"
      - "eng-practice/guides/**/*.pdf"
      - "eng-practice/guides/**/*.PDF"
      - "eng-practice/guides/**/*.doc"
      - "eng-practice/guides/**/*.DOC"
      - "eng-practice/guides/**/*.docx"
      - "eng-practice/guides/**/*.DOCX"
      - "eng-practice/documents/**/*.pdf"
      - "eng-practice/documents/**/*.PDF"
      - "eng-practice/documents/**/*.doc"
      - "eng-practice/documents/**/*.DOC"
      - "eng-practice/documents/**/*.docx"
      - "eng-practice/documents/**/*.DOCX"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate site indexes
        shell: python
        run: |
          from pathlib import Path
          import json, re

          site = Path("eng-practice")
          document_extensions = {".pdf", ".doc", ".docx"}

          def title(path):
              value = re.sub(r"\s+", " ", path.stem.replace("_", " ").replace("-", " ")).strip()
              return value[:1].upper() + value[1:] if value else path.name

          def htmls(folder, title_overrides=None, pinned_order=None):
              if not folder.exists():
                  return []

              title_overrides = title_overrides or {}
              pinned_order = pinned_order or []
              pinned_rank = {file: index for index, file in enumerate(pinned_order)}
              entries = []

              for path in folder.rglob("*.html"):
                  if not path.is_file():
                      continue

                  relative_file = path.relative_to(folder).as_posix()
                  entry = {
                      "title": title_overrides.get(path.name, title(path)),
                      "file": relative_file,
                  }
                  if relative_file in pinned_rank:
                      entry["pinned"] = True
                  entries.append(entry)

              return sorted(
                  entries,
                  key=lambda entry: (
                      0 if entry["file"] in pinned_rank else 1,
                      pinned_rank.get(entry["file"], 0),
                      entry["title"].lower(),
                  ),
              )

          def document_files(folder):
              if not folder.exists():
                  return []

              return [
                  {"title": title(path), "file": path.relative_to(folder).as_posix()}
                  for path in sorted(
                      folder.rglob("*"),
                      key=lambda item: (item.name.lower(), item.as_posix().lower()),
                  )
                  if path.is_file() and path.suffix.lower() in document_extensions
              ]

          vocabulary_titles = {
              "121tu-nangcao-ielts.html": "121 từ nâng cao IELTS",
              "advanced_vocab_master_all.html": "Advanced Vocabulary Master",
              "c1-vocabulary.html": "C1 Vocabulary",
              "confusing-words.html": "Từ dễ nhầm",
              "dictionary.html": "Từ điển",
              "flashcards-oxford-604.html": "Oxford Flashcards 604",
              "oxford5000-full.html": "Oxford 5000",
              "vocabulary-new.html": "Bộ từ vựng mới",
              "vong-1-2-vocabulary-complete-examples.html": "Vocabulary · Vòng 1–2",
              "vong-3-4-vocabulary-complete-examples.html": "Vocabulary · Vòng 3–4",
              "vong-5-6-vocabulary-complete-examples.html": "Vocabulary · Vòng 5–6",
          }

          vocabulary_pinned = [
              "vong-1-2-vocabulary-complete-examples.html",
              "vong-3-4-vocabulary-complete-examples.html",
              "vong-5-6-vocabulary-complete-examples.html",
              "confusing-words.html",
              "flashcards-oxford-604.html",
          ]

          grammar_titles = {
              "English-Grammar-25-Topics-Interactive.html": "English Grammar · 25 Topics Interactive",
              "so-do-tu-duy-ngu-phap-modules-3-25.html": "Sơ đồ tư duy ngữ pháp · Modules 3–25",
          }

          grammar_pinned = [
              "English-Grammar-25-Topics-Interactive.html",
              "so-do-tu-duy-ngu-phap-modules-3-25.html",
          ]

          documents = site / "documents"
          document_entries = document_files(documents)

          guides = site / "guides"
          guide_entries = htmls(guides) + document_files(guides)
          guide_entries.sort(key=lambda entry: entry["title"].lower())

          (site / "documents.json").write_text(json.dumps(document_entries, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          (site / "vocabulary.json").write_text(json.dumps(htmls(site / "Vocabulary", vocabulary_titles, vocabulary_pinned), ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          (site / "grammar.json").write_text(json.dumps(htmls(site / "grammar", grammar_titles, grammar_pinned), ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          (site / "listening.json").write_text(json.dumps(htmls(site / "listening"), ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          (site / "speaking.json").write_text(json.dumps(htmls(site / "speaking"), ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          (site / "writing.json").write_text(json.dumps(htmls(site / "writing"), ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          (site / "guides.json").write_text(json.dumps(guide_entries, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          excluded = {
              "index.html", "404.html", "documents.html", "vocabulary-new.html",
              "vong-1-2-vocabulary-complete-examples.html",
              "vong-3-4-vocabulary-complete-examples.html",
              "vong-5-6-vocabulary-complete-examples.html",
              "c1-vocabulary.html", "confusing-words.html", "english-verbs.html",
              "five-forms-of-verbs-with-3rd-person.html", "phrasal-verbs.html",
              "paraphrase.html", "ielts-collocations-topic-table-with-dictation.html",
              "ielts_hiking_collocations_full_with_dictation.html"
          }
          apps = [
              {"title": title(path), "file": path.name}
              for path in sorted(site.glob("*.html"), key=lambda item: item.name.lower())
              if path.name not in excluded
          ]
          (site / "apps.json").write_text(json.dumps(apps, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

      - name: Commit generated indexes
        run: |
          if git diff --quiet -- eng-practice/apps.json eng-practice/documents.json eng-practice/vocabulary.json eng-practice/grammar.json eng-practice/listening.json eng-practice/speaking.json eng-practice/writing.json eng-practice/guides.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eng-practice/apps.json eng-practice/documents.json eng-practice/vocabulary.json eng-practice/grammar.json eng-practice/listening.json eng-practice/speaking.json eng-practice/writing.json eng-practice/guides.json
          git commit -m "Update site library indexes"
          git push
