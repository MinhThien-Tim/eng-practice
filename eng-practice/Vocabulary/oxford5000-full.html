<title>Oxford 5000 — Trọn bộ</title>

<style>

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--brown);font-family:'Nunito',sans-serif;min-height:100vh;padding:18px 12px 60px;}
  .wrap{max-width:600px;margin:0 auto;}
  .eyebrow{font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--orange);margin-bottom:4px;}
  h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;margin:0 0 10px;color:var(--brown);}
  select{
    width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--cream-border);
    background:#fff;color:var(--brown);font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;
    margin-bottom:14px;-webkit-appearance:none;appearance:none;
  }
  .statrow{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#9a8a6a;margin-bottom:10px;font-weight:700;}
  .statrow button{background:#fff;border:2px solid var(--cream-border);color:var(--brown);padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;}
  .statrow button:hover{background:var(--cream);}
  .card{background:var(--cream);border:2px solid var(--cream-border);border-radius:22px;padding:28px 22px;margin-bottom:14px;cursor:pointer;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;}
  .badges{display:flex;gap:8px;align-items:center;position:absolute;top:16px;left:18px;flex-wrap:wrap;}
  .badge{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:12px;padding:3px 10px;border-radius:12px;}
  .badge.root{background:var(--orange);color:#fff;}
  .badge.level{background:var(--green);color:var(--green-text);}
  .badge.pos{background:var(--pos);color:#fff;}
  .idx{position:absolute;top:16px;right:18px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#8a8570;}
  .word{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:36px;color:var(--brown);margin-top:20px;margin-bottom:8px;}
  .ipa{font-size:16px;color:#4a4a4a;font-style:italic;margin-bottom:6px;}
  .meaning{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:22px;color:var(--orange);display:none;margin-top:8px;}
  .meaning.show{display:block;}
  .hint{text-align:center;font-size:12px;color:#b3a684;margin-top:2px;font-weight:700;}
  .navrow{display:flex;gap:10px;margin-top:8px;}
  .navbtn{flex:1;padding:13px;border-radius:12px;border:2px solid var(--cream-border);font-weight:700;font-size:14px;cursor:pointer;background:#fff;color:var(--brown);}
  .navbtn.unknown{background:#fdeae5;border-color:var(--red);color:var(--red);}
  .navbtn.known{background:#e7f7ef;border-color:var(--green-text);color:var(--green-text);}
  footer{text-align:center;margin-top:20px;font-size:11px;color:#b3a684;font-weight:700;}
</style>
</head>

    <div class="hint" id="cHint">chạm vào thẻ để xem nghĩa</div>

    <button class="navbtn known" onclick="markCard(true)">Đã thuộc</button>

  <footer>Oxford 5000 American English · 1994 từ · 12 phần</footer>
</div>

    deck = ALL_WORDS.map(x => ({...x}));
  } else {
    const p = PARTS.find(pp => String(pp.part) === String(currentSelection));
    deck = p.words.map(w => ({w:w[0], pos:w[1], level:w[2], ipa:w[3], vi:w[4], part:p.part}));

  deck.forEach(d => d.known = knownSet.has(keyOf(d)));

function currentDeck(){ return onlyUnknown ? deck.filter(d=>!d.known) : deck; }

  document.getElementById('cVi').classList.toggle('show', flipped);
  document.getElementById('cHint').textContent=flipped?'':'chạm vào thẻ để xem nghĩa';
  document.getElementById('count').textContent=(curIdx+1)+" / "+cd.length;
}
function flip(){flipped=!flipped;renderCard();}
function nextCard(){flipped=false;curIdx++;renderCard();}
function prevCard(){flipped=false;curIdx--;renderCard();}
function markCard(isKnown){
  const cd=currentDeck(); if(cd.length===0) return;
  const item = cd[curIdx];
  item.known = isKnown;
  if(isKnown) knownSet.add(keyOf(item)); else knownSet.delete(keyOf(item));
  nextCard();
}
function shuffleDeck(){
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  curIdx=0;flipped=false;renderCard();
}
function filterUnknown(){
  onlyUnknown=!onlyUnknown;
  document.getElementById('filterBtn').textContent=onlyUnknown?"Xem tất cả":"Chỉ từ chưa thuộc";
  curIdx=0;flipped=false;renderCard();
}
document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowRight') nextCard();
  if(e.key==='ArrowLeft') prevCard();
  if(e.key===' '){e.preventDefault();flip();}
});

buildDeck();
renderCard();
</script>
</body>
</html>
