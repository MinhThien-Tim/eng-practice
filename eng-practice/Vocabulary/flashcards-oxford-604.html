<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexicon — Bộ Từ Vựng 604 Từ</title>
<style>
  :root{
    --paper:#f4f0e8;
    --paper-2:#fbf8f3;
    --ink:#3d372f;
    --ink-soft:#928a7b;
    --rule:#e4ddce;
    --accent:#bd7c66;
    --accent-soft:#d0977e;
    --gold:#bb9958;
    --card-back:#4d4238;
    --sage:#7f9376;
    --radius-lg:20px;
    --radius:14px;
    --radius-sm:10px;
    --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --display: "Didot","Bodoni MT","Playfair Display",Georgia,serif;
    --mono: "Courier New", Courier, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.3), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    min-height:100vh;
    padding:18px 14px 36px;
  }
  .wrap{max-width:600px;margin:0 auto;}

  header{
    text-align:center;
    margin-bottom:14px;
    padding-bottom:12px;
    border-bottom:1px solid var(--rule);
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--accent);
  }
  h1{
    font-family:var(--display);
    font-weight:700;
    font-style:italic;
    font-size:24px;
    margin:4px 0 2px;
    letter-spacing:0.01em;
  }
  .subtitle{
    font-size:12px;
    color:var(--ink-soft);
    font-style:italic;
  }

  .mode-switch{
    display:flex;
    justify-content:center;
    gap:0;
    margin-bottom:10px;
    border:1px solid var(--rule);
    border-radius:999px;
    overflow:hidden;
    width:fit-content;
    margin-left:auto;
    margin-right:auto;
    background:var(--paper-2);
  }
  .mode-switch button{
    flex:none;
    border:none;
    border-radius:0;
    background:transparent;
    padding:7px 16px;
    font-size:11px;
  }
  .mode-switch button.active{
    background:var(--ink);
    color:var(--paper);
  }

  /* filter pill */
  .filter-row{
    display:flex;
    justify-content:center;
    margin:0 0 10px;
  }
  .filter-pill{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.03em;
    border:1px solid var(--rule);
    background:var(--paper-2);
    color:var(--ink-soft);
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:7px;
    transition:background .15s, color .15s, border-color .15s;
  }
  .filter-pill .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--rule);
    transition:background .15s;
  }
  .filter-pill.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  .filter-pill.active .dot{
    background:var(--sage);
  }

  /* progress strip */
  .progress-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
    margin:0 2px 6px;
  }
  .progress-bar{
    height:4px;
    background:var(--rule);
    border-radius:6px;
    overflow:hidden;
    margin:0 2px 12px;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    border-radius:6px;
    width:0%;
    transition:width .3s ease;
  }

  /* card */
  .stage{
    perspective:1400px;
    margin:0 0 12px;
  }
  .card{
    position:relative;
    width:100%;
    min-height:210px;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:var(--radius-lg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:22px 20px;
    text-align:center;
  }
  .face.front{
    background:var(--paper-2);
    border:1px solid var(--rule);
    box-shadow:0 8px 20px -14px rgba(61,55,47,0.3);
  }
  .card-index{
    position:absolute;
    top:14px;
    left:16px;
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-soft);
    letter-spacing:0.06em;
  }
  .card-pos{
    position:absolute;
    top:12px;
    right:14px;
    font-family:var(--mono);
    font-size:13px;
    font-weight:700;
    letter-spacing:0.03em;
    font-style:normal;
    padding:4px 10px;
    border-radius:999px;
    border:1px solid transparent;
  }
  .pos-v{ background:#e7ede3; color:#5f7355; border-color:#b9c9ae; }
  .pos-n{ background:#e6ebf1; color:#4f6478; border-color:#b7c5d6; }
  .pos-adj{ background:#f3e6e0; color:#96543f; border-color:#ddb3a2; }
  .pos-adv{ background:#efe4f2; color:#7a5484; border-color:#d3b8da; }
  .pos-phr{ background:#f3ecd9; color:#8a6f2e; border-color:#ddc98a; }
  .pos-multi{ background:#ece7dc; color:#6b6153; border-color:#cfc6b3; }
  .headword{
    font-family:var(--display);
    font-size:32px;
    font-weight:700;
    line-height:1.08;
    margin-bottom:8px;
    word-break:break-word;
  }
  .ipa{
    font-family:var(--serif);
    font-style:italic;
    font-size:15px;
    color:var(--accent);
    letter-spacing:0.02em;
  }

  .face.back{
    background:var(--card-back);
    color:var(--paper);
    transform:rotateY(180deg);
    box-shadow:0 8px 20px -14px rgba(0,0,0,0.4);
  }
  .back .headword-small{
    font-family:var(--display);
    font-style:italic;
    font-size:14px;
    color:var(--gold);
    margin-bottom:8px;
    opacity:0.9;
  }
  .meaning{
    font-size:19px;
    line-height:1.4;
    font-weight:400;
  }
  .back .rule{
    width:28px;
    height:1px;
    background:var(--gold);
    margin:12px auto 0;
    opacity:0.6;
  }

  /* done state */
  .done-state{
    display:none;
    text-align:center;
    padding:50px 20px;
    background:var(--paper-2);
    border:1px solid var(--rule);
    border-radius:var(--radius-lg);
    margin-bottom:12px;
  }
  .done-state .emoji{font-size:32px;margin-bottom:8px;}
  .done-state p{
    font-family:var(--serif);
    font-style:italic;
    color:var(--ink-soft);
    font-size:14px;
    margin:0;
  }

  /* controls */
  .controls{
    display:flex;
    gap:8px;
    margin-bottom:6px;
  }
  button{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    border:1px solid var(--rule);
    background:var(--paper-2);
    color:var(--ink);
    padding:10px 8px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    flex:1;
    transition:background .15s, transform .1s;
  }
  button:active{transform:scale(0.97);}
  button:hover{background:#ede6d7;}
  .btn-know{
    border-color:var(--sage);
    color:var(--sage);
  }
  .btn-know:hover{background:rgba(127,147,118,0.12);}
  .btn-again{
    border-color:var(--accent);
    color:var(--accent);
  }
  .btn-again:hover{background:rgba(189,124,102,0.10);}

  .nav-row{
    display:flex;
    gap:8px;
  }
  .nav-row button{
    background:transparent;
  }

  /* toolbar */
  .toolbar{
    display:flex;
    gap:8px;
    margin:16px 0 8px;
  }
  .toolbar input[type=text]{
    flex:1;
    font-family:var(--serif);
    font-size:14px;
    padding:9px 12px;
    border:1px solid var(--rule);
    background:var(--paper-2);
    border-radius:var(--radius-sm);
    color:var(--ink);
  }
  .toolbar input::placeholder{color:var(--ink-soft);}
  .toolbar select{
    font-family:var(--mono);
    font-size:11px;
    border:1px solid var(--rule);
    background:var(--paper-2);
    color:var(--ink);
    padding:0 10px;
    border-radius:var(--radius-sm);
  }

  /* list mode */
  .list-view{margin-top:4px;}
  .entry{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:10px 6px;
    border-bottom:1px solid var(--rule);
    cursor:pointer;
    border-radius:var(--radius-sm);
  }
  .entry:hover{background:rgba(189,124,102,0.06);}
  .entry .idx{
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-soft);
    width:24px;
    flex-shrink:0;
  }
  .entry .ew{
    font-weight:700;
    min-width:110px;
  }
  .entry .eipa{
    font-style:italic;
    color:var(--accent);
    font-size:12px;
    flex-shrink:0;
  }
  .entry .epos{
    font-family:var(--mono);
    font-size:11px;
    font-weight:700;
    font-style:normal;
    flex-shrink:0;
    padding:2px 8px;
    border-radius:999px;
    border:1px solid transparent;
  }
  .entry .em{
    color:var(--ink-soft);
    font-size:12px;
    flex:1;
    text-align:right;
  }

  .empty-state{
    text-align:center;
    padding:44px 20px;
    color:var(--ink-soft);
    font-style:italic;
  }

  footer{
    text-align:center;
    margin-top:22px;
    font-family:var(--mono);
    font-size:9px;
    color:var(--ink-soft);
    letter-spacing:0.08em;
    opacity:0.6;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Advanced English — Vietnamese Gloss</div>
    <h1>A Lexicon of 604 Words</h1>
    <div class="subtitle">tra cứu · lật thẻ · tự kiểm tra</div>
  </header>

  <div class="mode-switch" id="modeSwitch">

    <button id="btnListMode">Danh mục</button>

  <div id="cardMode">
    <div class="filter-row">
      <button class="filter-pill" id="btnFilter"><span class="dot"></span><span id="filterLabel">Chỉ hiện từ chưa thuộc</span></button>
    </div>

    <div class="progress-row">
      <span id="progressLabel">1 / 604</span>
      <span id="progressStats">Đã thuộc: 0 · Cần ôn: 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="stage">
      <div class="card" id="card">
        <div class="face front">
          <div class="card-index" id="cardIndex">001</div>
          <div class="card-pos" id="cardPos">v</div>
          <div class="headword" id="headword">Abate</div>
          <div class="ipa" id="ipa">/əˈbeɪt/</div>
        </div>
        <div class="face back">

          <div class="meaning" id="meaning">Làm dịu, giảm bớt</div>
          <div class="rule"></div>
        </div>
      </div>
    </div>

    <div class="done-state" id="doneState">

    </div>

    <div class="controls" id="controlsRow">
      <button class="btn-again" id="btnAgain">✕ Ôn lại</button>
      <button class="btn-know" id="btnKnow">✓ Đã thuộc</button>

    <div class="nav-row" id="navRow">
      <button id="btnPrev">← Trước</button>
      <button id="btnShuffle">⟳ Xáo trộn</button>
      <button id="btnNext">Sau →</button>
    </div>
  </div>

  <div id="listMode" style="display:none;">
    <div class="toolbar">
      <input type="text" id="searchBox" placeholder="Tìm từ hoặc nghĩa…">
      <select id="filterPos">
        <option value="">Tất cả</option>
        <option value="v">v</option>
        <option value="n">n</option>
        <option value="adj">adj</option>
        <option value="adv">adv</option>
        <option value="phr">phr</option>
      </select>
    </div>
    <div class="list-view" id="listView"></div>
    <div class="empty-state" id="emptyState" style="display:none;">Không tìm thấy từ nào.</div>
  </div>

  <footer>OXFORD-STYLE ENTRY · 604 HEADWORDS · IPA · VI GLOSS</footer>
</div>

w": "Dwarf", "ipa": "dwɔːf", "pos": "v", "m": "làm lu mờ"}, {"w": "Outpace", "ipa": "ˌaʊtˈpeɪs", "pos": "v", "m": "vượt tốc độ"}, {"w": "Exceed", "ipa": "ɪkˈsiːd", "pos": "v", "m": "vượt quá"}, {"w": "Undergo", "ipa": "ˌʌndəˈɡəʊ", "pos": "v", "m": "trải qua"}, {"w": "Peak", "ipa": "piːk", "pos": "n/v", "m": "đạt đỉnh"}, {"w": "Deteriorate", "ipa": "dɪˈtɪəriəreɪt", "pos": "v", "m": "xấu đi"}, {"w": "Soar", "ipa": "sɔː(r)", "pos": "v", "m": "tăng vọt"}, {"w": "Decline", "ipa": "dɪˈklaɪn", "pos": "n/v", "m": "suy giảm"}, {"w": "Plateau", "ipa": "ˈplætəʊ", "pos": "n/v", "m": "chững lại, đi ngang"}, {"w": "Rebound", "ipa": "rɪˈbaʊnd", "pos": "n/v", "m": "phục hồi, tăng trở lại"}, {"w": "Address", "ipa": "əˈdres", "pos": "v", "m": "xử lý (một vấn đề)"}, {"w": "Acknowledge", "ipa": "əkˈnɒlɪdʒ", "pos": "v", "m": "công nhận"}, {"w": "Assert", "ipa": "əˈsɜːt", "pos": "v", "m": "khẳng định mạnh mẽ"}, {"w": "Contradict", "ipa": "ˌkɒntrəˈdɪkt", "pos": "v", "m": "mâu thuẫn"}, {"w": "Overlook", "ipa": "ˌəʊvəˈlʊk", "pos": "v", "m": "bỏ qua"}, {"w": "Rectify", "ipa": "ˈrektɪfaɪ", "pos": "v", "m": "sửa chữa"}, {"w": "Curb", "ipa": "kɜːb", "pos": "v", "m": "kiềm chế"}, {"w": "Devise", "ipa": "dɪˈvaɪz", "pos": "v", "m": "nghĩ ra"}, {"w": "Implement", "ipa": "ˈɪmplɪment", "pos": "v", "m": "thực thi"}, {"w": "Embody", "ipa": "ɪmˈbɒdi", "pos": "v", "m": "hiện thân của"}, {"w": "Instil", "ipa": "ɪnˈstɪl", "pos": "v", "m": "truyền dạy"}, {"w": "Invoke", "ipa": "ɪnˈvəʊk", "pos": "v", "m": "viện dẫn"}, {"w": "Precipitate", "ipa": "prɪˈsɪpɪteɪt", "pos": "v", "m": "làm xảy ra"}, {"w": "Perpetuate", "ipa": "pəˈpetʃueɪt", "pos": "v", "m": "kéo dài, duy trì"}, {"w": "Eliminate", "ipa": "ɪˈlɪmɪneɪt", "pos": "v", "m": "loại bỏ"}, {"w": "Harness", "ipa": "ˈhɑːnɪs", "pos": "v", "m": "khai thác"}, {"w": "Retain", "ipa": "rɪˈteɪn", "pos": "v", "m": "giữ lại"}, {"w": "Scrutinise", "ipa": "ˈskruːtənaɪz", "pos": "v", "m": "xem xét kỹ"}, {"w": "Speculate", "ipa": "ˈspekjuleɪt", "pos": "v", "m": "phỏng đoán"}, {"w": "Infer", "ipa": "ɪnˈfɜː(r)", "pos": "v", "m": "suy ra"}, {"w": "Highlight", "ipa": "ˈhaɪlaɪt", "pos": "v", "m": "nhấn mạnh"}, {"w": "Contend", "ipa": "kənˈtend", "pos": "v", "m": "cho rằng"}, {"w": "Reiterate", "ipa": "riːˈɪtəreɪt", "pos": "v", "m": "nhắc lại"}, {"w": "Justify", "ipa": "ˈdʒʌstɪfaɪ", "pos": "v", "m": "biện minh"}, {"w": "Underscore", "ipa": "ˌʌndəˈskɔː(r)", "pos": "v", "m": "nhấn mạnh"}, {"w": "Conceptualise", "ipa": "kənˈseptʃuəlaɪz", "pos": "v", "m": "hình dung"}, {"w": "Evaluate", "ipa": "ɪˈvæljueɪt", "pos": "v", "m": "đánh giá"}, {"w": "Differentiate", "ipa": "ˌdɪfəˈrenʃieɪt", "pos": "v", "m": "phân biệt"}, {"w": "Synthesise", "ipa": "ˈsɪnθəsaɪz", "pos": "v", "m": "tổng hợp"}, {"w": "Demonstrate", "ipa": "ˈdemənstreɪt", "pos": "v", "m": "chứng minh"}, {"w": "Inequity", "ipa": "ɪnˈekwəti", "pos": "n", "m": "sự bất bình đẳng"}, {"w": "Prosperity", "ipa": "prɒˈsperəti", "pos": "n", "m": "thịnh vượng"}, {"w": "Affluence", "ipa": "ˈæfluəns", "pos": "n", "m": "giàu có"}, {"w": "Initiative", "ipa": "ɪˈnɪʃətɪv", "pos": "n", "m": "sáng kiến"}, {"w": "Intervention", "ipa": "ˌɪntəˈvenʃn", "pos": "n", "m": "sự can thiệp"}, {"w": "Infrastructure", "ipa": "ˈɪnfrəstrʌktʃə(r)", "pos": "n", "m": "cơ sở hạ tầng"}, {"w": "Legislation", "ipa": "ˌledʒɪsˈleɪʃn", "pos": "n", "m": "luật pháp"}, {"w": "Socioeconomic", "ipa": "ˌsəʊsiəʊˌekəˈnɒmɪk", "pos": "adj", "m": "kinh tế – xã hội"}, {"w": "Prevalence", "ipa": "ˈprevələns", "pos": "n", "m": "mức độ phổ biến"}];

// ---------------- state ----------------
let order = WORDS.map((_, i) => i);
let pos = 0;
let flipped = false;
let status = {}; // idx -> 'know' | 'again'
let filterOn = false;

const el = id => document.getElementById(id);

function posColorVar(pos){
  const p = pos.trim().toLowerCase();
  if(p.includes('/')) return 'pos-multi';
  if(p.startsWith('phr')) return 'pos-phr';
  if(p === 'v') return 'pos-v';
  if(p === 'n') return 'pos-n';
  if(p === 'adj') return 'pos-adj';
  if(p === 'adv') return 'pos-adv';
  return 'pos-multi';
}

function getVisible(){
  return filterOn ? order.filter(i => status[i] !== 'know') : order;
}

function render(){
  const visible = getVisible();
  const known = Object.values(status).filter(s => s === 'know').length;
  const again = Object.values(status).filter(s => s === 'again').length;
  el('progressStats').textContent = 'Đã thuộc: ' + known + ' · Cần ôn: ' + again;

  if(visible.length === 0){
    el('doneState').style.display = 'block';
    el('card').parentElement.style.display = 'none';
    el('controlsRow').style.display = 'none';
    el('navRow').style.display = 'none';
    el('progressLabel').textContent = '0 / ' + WORDS.length;
    el('progressFill').style.width = '0%';
    return;
  }
  el('doneState').style.display = 'none';
  el('card').parentElement.style.display = '';
  el('controlsRow').style.display = 'flex';
  el('navRow').style.display = 'flex';

  if(pos >= visible.length) pos = 0;
  if(pos < 0) pos = visible.length - 1;

  const i = visible[pos];
  const w = WORDS[i];
  el('cardIndex').textContent = String(i+1).padStart(3,'0');
  el('cardPos').textContent = w.pos;
  el('cardPos').className = 'card-pos ' + posColorVar(w.pos);
  el('headword').textContent = w.w;
  el('ipa').textContent = '/' + w.ipa + '/';
  el('headwordSmall').textContent = w.w;
  el('meaning').textContent = w.m;
  el('progressLabel').textContent = (pos+1) + ' / ' + visible.length;
  el('progressFill').style.width = ((pos+1) / visible.length * 100) + '%';

  const card = el('card');
  flipped = false;
  card.classList.remove('flipped');
}

function flip(){
  flipped = !flipped;
  el('card').classList.toggle('flipped', flipped);
}

function next(){
  const visible = getVisible();
  if(visible.length === 0){ render(); return; }
  pos = (pos + 1) % visible.length;
  render();
}
function prev(){
  const visible = getVisible();
  if(visible.length === 0){ render(); return; }
  pos = (pos - 1 + visible.length) % visible.length;
  render();
}
function mark(state){
  const visible = getVisible();
  if(visible.length === 0) return;
  const idx = visible[pos];
  status[idx] = state;
  if(filterOn && state === 'know'){
    // item drops out of the visible list at this position; don't advance
    render();
  } else {
    next();
  }
}
function shuffle(){
  for(let a = order.length - 1; a > 0; a--){
    const b = Math.floor(Math.random() * (a+1));
    [order[a], order[b]] = [order[b], order[a]];
  }
  pos = 0;
  render();
}
function toggleFilter(){
  filterOn = !filterOn;
  el('btnFilter').classList.toggle('active', filterOn);
  pos = 0;
  render();
}

el('card').addEventListener('click', flip);
el('btnKnow').addEventListener('click', (e)=>{ e.stopPropagation(); mark('know'); });
el('btnAgain').addEventListener('click', (e)=>{ e.stopPropagation(); mark('again'); });
el('btnNext').addEventListener('click', next);
el('btnPrev').addEventListener('click', prev);
el('btnShuffle').addEventListener('click', shuffle);
el('btnFilter').addEventListener('click', toggleFilter);

document.addEventListener('keydown', (e)=>{
  if(el('cardMode').style.display === 'none') return;
  if(e.key === 'ArrowRight') next();
  else if(e.key === 'ArrowLeft') prev();
  else if(e.key === ' '){ e.preventDefault(); flip(); }
  else if(e.key === '1') mark('again');
  else if(e.key === '2') mark('know');
});

// ---------------- list mode ----------------
function renderList(){
  const q = el('searchBox').value.trim().toLowerCase();
  const posFilter = el('filterPos').value;
  const container = el('listView');
  container.innerHTML = '';
  let count = 0;
  WORDS.forEach((w, i) => {
    if(posFilter && w.pos !== posFilter) return;
    if(q && !(w.w.toLowerCase().includes(q) || w.m.toLowerCase().includes(q))) return;
    count++;
    const row = document.createElement('div');
    row.className = 'entry';
    row.innerHTML = `
      <span class="idx">${String(i+1).padStart(3,'0')}</span>
      <span class="ew">${w.w}</span>
      <span class="eipa">/${w.ipa}/</span>
      <span class="epos ${posColorVar(w.pos)}">${w.pos}</span>
      <span class="em">${w.m}</span>
    `;
    row.addEventListener('click', () => {
      const idxInOrder = order.indexOf(i);
      if(idxInOrder === -1){ order.push(i); }
      filterOn = false;
      el('btnFilter').classList.remove('active');
      pos = order.indexOf(i);
      render();
      setMode('card');
    });
    container.appendChild(row);
  });
  el('emptyState').style.display = count === 0 ? 'block' : 'none';
}

el('searchBox').addEventListener('input', renderList);
el('filterPos').addEventListener('change', renderList);

function setMode(mode){
  if(mode === 'card'){
    el('cardMode').style.display = '';
    el('listMode').style.display = 'none';
    el('btnCardMode').classList.add('active');
    el('btnListMode').classList.remove('active');
  } else {
    el('cardMode').style.display = 'none';
    el('listMode').style.display = '';
    el('btnCardMode').classList.remove('active');
    el('btnListMode').classList.add('active');
    renderList();
  }
}
el('btnCardMode').addEventListener('click', () => setMode('card'));
el('btnListMode').addEventListener('click', () => setMode('list'));

render();
</script>
