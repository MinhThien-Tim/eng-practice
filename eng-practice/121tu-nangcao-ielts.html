["Volatile","adj","C1","/ˈvɑːlətl/","biến động, dễ thay đổi",[["The market remained highly volatile.","Thị trường vẫn biến động mạnh."],["Oil prices are notoriously volatile.","Giá dầu nổi tiếng là biến động thất thường."],["The situation was politically volatile.","Tình hình mang tính biến động về mặt chính trị."]]]

let deck = DATA.map((d,i)=>({w:d[0],pos:d[1],level:d[2],ipa:d[3],vi:d[4],examples:d[5],idx:i,known:false}));
let curIdx=0, flipped=false, onlyUnknown=false;

function currentDeck(){ return onlyUnknown ? deck.filter(d=>!d.known) : deck; }

function renderCard(){
  const cd = currentDeck();
  if(cd.length===0){
    document.getElementById('cWord').textContent="Tất cả đã thuộc!";
    document.getElementById('cIpa').textContent=""; document.getElementById('cVi').textContent="";
    document.getElementById('cLevel').textContent=""; document.getElementById('cPos').textContent="";
    document.getElementById('exwrap').classList.remove('show');
    document.getElementById('count').textContent="0 / 0";
    return;
  }
  if(curIdx>=cd.length) curIdx=0;
  if(curIdx<0) curIdx=cd.length-1;
  const item=cd[curIdx];
  const baseWord = item.w.split(' (')[0].split(' / ')[0];
  document.getElementById('cWord').textContent=item.w;
  document.getElementById('cIpa').textContent=item.ipa;
  document.getElementById('cVi').textContent=item.vi;
  document.getElementById('cLevel').textContent=item.level;
  document.getElementById('cPos').textContent=item.pos;
  const exListEl = document.getElementById('exList');
  exListEl.innerHTML='';
  item.examples.forEach((pair,i)=>{
    const div=document.createElement('div');
    div.className='ex-item';
    const enHtml = pair[0].replace(new RegExp(baseWord,'i'), m=>"<b>"+m+"</b>");
    div.innerHTML = '<div class="ex-label">Ex '+(i+1)+':</div><div class="ex-en">'+enHtml+'</div><div class="ex-vi">'+pair[1]+'</div>';
    exListEl.appendChild(div);
  });
  document.getElementById('exwrap').classList.toggle('show', flipped);
  document.getElementById('cHint').textContent=flipped?'':'chạm vào thẻ để xem nghĩa';
  document.getElementById('count').textContent=(curIdx+1)+" / "+cd.length;
}
function flip(){flipped=!flipped;renderCard();}
function nextCard(){flipped=false;curIdx++;renderCard();}
function prevCard(){flipped=false;curIdx--;renderCard();}
function markCard(isKnown){
  const cd=currentDeck(); if(cd.length===0) return;
  cd[curIdx].known=isKnown; nextCard();
}
function shuffleDeck(){
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  curIdx=0;flipped=false;renderCard();
}
function filterUnknown(){
  onlyUnknown=!onlyUnknown;
  document.getElementById('filterBtn').textContent=onlyUnknown?"Xem tất cả":"Chỉ từ chưa thuộc";
  curIdx=0;flipped=false;renderCard();
}
document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowRight') nextCard();
  if(e.key==='ArrowLeft') prevCard();
  if(e.key===' '){e.preventDefault();flip();}
});
renderCard();
</script>
