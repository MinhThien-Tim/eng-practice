<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thư viện PDF — English Study</title>
<style>
:root{--bg:#17201d;--paper:#f2eedf;--paper2:#fbf8ec;--ink:#202522;--muted:#756f61;--line:#d4ccb6;--accent:#b97825}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}.wrap{max-width:980px;margin:auto;padding:28px 16px 70px}header{color:white;border-bottom:1px solid #506059;padding-bottom:18px;margin-bottom:18px}.eyebrow{font-size:11px;letter-spacing:.12em;color:#d59a4b;font-weight:bold}h1{font:700 clamp(30px,6vw,44px) Georgia,serif;margin:5px 0}header p{color:#aeb8b2;margin:0}.home{display:inline-block;margin-top:14px;color:#f2eedf;text-decoration:none}.paper{background:var(--paper);border-radius:11px;overflow:hidden}.toolbar{padding:16px;border-bottom:1px solid var(--line)}input{width:100%;padding:12px;border:1px solid #bcb39c;border-radius:7px;background:var(--paper2);font-size:14px}.count{padding:10px 16px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}.cards{padding:12px}.card{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--paper2);border:1px solid #ddd5bf;border-radius:9px;padding:15px;margin-bottom:10px}.title{font:700 18px Georgia,serif;word-break:break-word}.file{font-size:11px;color:var(--muted);margin-top:5px}.open{white-space:nowrap;text-decoration:none;background:var(--ink);color:white;border-radius:7px;padding:10px 13px;font-weight:bold;font-size:12px}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:560px){.card{align-items:flex-start;flex-direction:column}.open{width:100%;text-align:center}}
</style></head><body><div class="wrap"><header><div class="eyebrow">ENGLISH STUDY · DOCUMENT LIBRARY</div><h1>Tài liệu PDF</h1><p>Danh mục được tạo tự động từ thư mục <b>documents/</b>.</p><a class="home" href="index.html">← Trang chủ</a></header><main class="paper"><div class="toolbar"><input id="q" placeholder="Tìm tài liệu..."></div><div class="count" id="count">Đang tải...</div><div class="cards" id="cards"></div></main></div>
<script>
let docs=[];const cards=document.getElementById('cards'),count=document.getElementById('count'),q=document.getElementById('q');
function render(){const s=q.value.trim().toLowerCase();const a=docs.filter(x=>x.title.toLowerCase().includes(s)||x.file.toLowerCase().includes(s));count.textContent=`${a.length} tài liệu`;cards.innerHTML=a.length?a.map(x=>`<article class="card"><div><div class="title">${esc(x.title)}</div><div class="file">${esc(x.file)}</div></div><a class="open" target="_blank" rel="noopener" href="documents/${encodeURIComponent(x.file)}">MỞ PDF →</a></article>`).join(''):'<div class="empty">Chưa có tài liệu PDF.</div>'}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
fetch('documents.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]).then(x=>{docs=x;render()}).catch(()=>{docs=[];render()});q.addEventListener('input',render);
</script></body></html>
