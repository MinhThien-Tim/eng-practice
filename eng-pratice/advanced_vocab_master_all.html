  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; min-height:110px; padding:14px; cursor:pointer; position:relative; transition:box-shadow .15s, transform .1s, border-color .15s; display:flex; flex-direction:column; justify-content:center;}

  .card .star-btn{position:absolute; top:6px; right:8px; font-size:16px; line-height:1; background:none; border:none; cursor:pointer; color:var(--line); padding:2px;}

  .word{font-size:18px; font-weight:bold; margin-top:16px; margin-bottom:2px;}
  .vi{font-size:14.5px; line-height:1.4; color:var(--ink); margin-top:16px;}
  .hint{font-family:Arial,sans-serif; font-size:10.5px; color:var(--sub); margin-top:8px;}

{w:"Groan",vi:"rên rỉ, than vãn",cat:"Từ khẩu ngữ / Ít gặp"},
{w:"Blush",vi:"đỏ mặt",cat:"Từ khẩu ngữ / Ít gặp"},
{w:"Flush",vi:"đỏ bừng / xả nước",cat:"Từ khẩu ngữ / Ít gặp"}
];

const CATS = [...new Set(DATA.map(d=>d.cat))];
let flipState = new Array(DATA.length).fill(0);
let marked = new Set(); // indices marked as "chưa thuộc"
let activeCat = "all";
let searchQ = "";
let onlyMarkedMode = false;

function slug(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w]+/g,'-'); }

function faceHTML(item, state){
  if(state===0){
    return `<div class="word">${item.w}</div><div class="hint">Nhấn để xem nghĩa →</div>`;
  }
  return `<div class="word" style="font-size:15px">${item.w}</div><div class="vi">${item.vi}</div><div class="hint">Nhấn để quay lại →</div>`;
}

function matchesFilter(item, idx){
  if(onlyMarkedMode && !marked.has(idx)) return false;
  if(activeCat!=="all" && item.cat!==activeCat) return false;
  if(searchQ){
    const hay = (item.w+" "+item.vi+" "+item.cat).toLowerCase();
    if(!hay.includes(searchQ)) return false;
  }
  return true;
}

function buildFilterOptions(){
  const sel = document.getElementById('catFilter');
  CATS.forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    sel.appendChild(opt);
  });
}

function buildNav(){
  const nav = document.getElementById('catNav');
  nav.innerHTML = CATS.map(c=>`<a href="#cat-${slug(c)}">${c}</a>`).join('');
}

function cardInnerHTML(item, idx){
  const isMarked = marked.has(idx);
  return `<span class="tag">${item.cat}</span>`
    + `<button class="star-btn ${isMarked?'on':''}" data-idx="${idx}" title="Đánh dấu chưa thuộc">${isMarked?'★':'☆'}</button>`
    + faceHTML(item, flipState[idx]);
}

function render(){
  const content = document.getElementById('content');
  content.innerHTML='';
  let anyVisible = false;
  CATS.forEach(cat=>{
    const items = DATA.map((it,idx)=>({it,idx})).filter(o=>o.it.cat===cat && matchesFilter(o.it,o.idx));
    if(items.length===0) return;
    anyVisible = true;
    const block = document.createElement('div');
    block.className='cat-block';
    block.id = `cat-${slug(cat)}`;
    block.innerHTML = `<div class="cat-title">${cat} <span class="count">(${items.length} từ)</span></div>`;
    const grid = document.createElement('div');
    grid.className='grid';
    items.forEach(o=>{
      const card = document.createElement('div');
      card.className='card' + (marked.has(o.idx) ? ' marked' : '');
      card.innerHTML = cardInnerHTML(o.it, o.idx);
      card.addEventListener('click', (e)=>{
        if(e.target.closest('.star-btn')) return;
        flipState[o.idx] = (flipState[o.idx]+1) % 2;
        card.innerHTML = cardInnerHTML(o.it, o.idx);
        updateProgress();
      });
      grid.appendChild(card);
    });
    block.appendChild(grid);
    content.appendChild(block);
  });
  if(!anyVisible){
    content.innerHTML = `<div class="empty-msg">Không có từ nào khớp bộ lọc hiện tại.${onlyMarkedMode ? ' Bạn chưa đánh dấu từ nào là "chưa thuộc".' : ''}</div>`;
  }
  // attach star handlers (delegate after render via event bubbling on content)
  updateProgress();
}

content_click_delegate();
function content_click_delegate(){
  document.getElementById('content').addEventListener('click', (e)=>{
    const btn = e.target.closest('.star-btn');
    if(!btn) return;
    e.stopPropagation();
    const idx = parseInt(btn.dataset.idx, 10);
    if(marked.has(idx)) marked.delete(idx); else marked.add(idx);
    render();
  });
}

function updateProgress(){
  const visibleCount = DATA.filter((it,idx)=>matchesFilter(it,idx)).length;
  const seenCount = DATA.filter((it,idx)=>matchesFilter(it,idx) && flipState[idx]===1).length;
  document.getElementById('progress').textContent = `Đã xem nghĩa: ${seenCount}/${visibleCount} từ (đang lọc) · Tổng số từ: ${DATA.length}`;
  document.getElementById('onlyMarked').textContent = `★ Chỉ hiện từ chưa thuộc (${marked.size})`;
  document.getElementById('onlyMarked').classList.toggle('starred', onlyMarkedMode);
}

document.getElementById('flipAll0').onclick = ()=>{ flipState.fill(0); render(); };
document.getElementById('flipAll1').onclick = ()=>{ flipState.fill(1); render(); };
document.getElementById('catFilter').addEventListener('change',(e)=>{ activeCat = e.target.value; render(); });
document.getElementById('filterBox').addEventListener('input',(e)=>{ searchQ = e.target.value.trim().toLowerCase(); render(); });
document.getElementById('onlyMarked').addEventListener('click', ()=>{ onlyMarkedMode = !onlyMarkedMode; render(); });
document.getElementById('clearMarked').addEventListener('click', ()=>{ marked.clear(); render(); });

buildFilterOptions();
buildNav();
render();
</script>
</body>
</html>
